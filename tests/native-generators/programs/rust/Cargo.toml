[package]
name = "polyspec-crudui-native-generator"
version = "0.0.20"
edition = "2021"
rust-version = "1.99.0"
publish = false

[dependencies]
polyspec-crud-ui-generator = { path = "../../../../packages/generator/rust" }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true

[workspace]

# make lint-rust runs cargo clippy, which fails on a warning and on the lints that hide an error (P8).
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
