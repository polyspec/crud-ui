# Build, validation, rendering and documentation checks of every push to main and of every manual run. The last job
# ci-passed needs every other job and fails unless each of them succeeded; a release requires it to have
# succeeded for the tagged commit (docs/operations/repository.md). The documentation web of main is deployed by
# .github/workflows/pages.yml.

name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

# The run of a commit of main is never cancelled by a later push: a release requires the checks of its own commit
# (tests/build/ci-local.test.mts).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# The toolchains of the checkout at their recorded versions (docs/operations/package-build.md): rustup installs nothing on the
# first cargo, and go never downloads the toolchain of a go.mod.
env:
  RUSTUP_AUTO_INSTALL: '0'
  GOTOOLCHAIN: local

jobs:
  # No other job reads a result of kit, so each starts with it; only ci-passed needs kit (S12: a dependency orders only
  # work that consumes an earlier result).
  kit:
    uses: ./.github/workflows/ci-pipeline.yml
    permissions:
      contents: read

  runtime-tests:
    name: runtime checks · shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '2', '3', '4']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
      - name: Install, then run the checks and write their report
        run: make ci-runtime-tests SHARD=${{ matrix.shard }}
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-runtime-tests-${{ matrix.shard }}
          path: var/report/ci-targets
          if-no-files-found: error
  build-lint:
    name: build, lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: phpize, php-config
      - name: Install, then run the checks and write their report
        run: make ci-build-lint
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-build-lint
          path: var/report/ci-targets
          if-no-files-found: error
