      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: phpize, php-config
      # The Go modules and builds of the generator and its programs, keyed on their go.mod files; make install-tools installs
      # the Go of mise.toml.
      - name: Cache the Go modules of the generator and its programs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('legacy/packages/generator/go/go.mod', 'legacy/tests/native-generators/programs/go/go.mod', 'benchmarks/validators/go/go.mod') }}
      # actions/cache v6.1.0: the crates of Cargo and the builds of the workspaces of the job, keyed on their locks and the
      # toolchain. The key reads no tool, so the cache is restored before the recipe of the job installs Rust.
      - name: Cache the crates and the builds of Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            benchmarks/validators/rust/target
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-cross-language-equivalence-${{ hashFiles('rust-toolchain.toml', 'benchmarks/validators/rust/Cargo.lock', 'Cargo.lock') }}
