          if-no-files-found: error
  form-runtime:
    name: Form instances and data injection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      # The machine setup of the job, which no recipe makes (C19.20): the sandbox helper of Chrome, the system libraries of WebKit.
      - uses: ./.github/actions/runner-setup
        with:
          browsers: chrome firefox webkit --with-deps --chrome-sandbox
      - name: Install, then run the checks and write their report
        run: make ci-form-runtime
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
