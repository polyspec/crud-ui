  cross-check-console:
    name: cross-check console gateway
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: phpize, php-config
      # actions/cache v6.1.0: the crates of Cargo and the builds of the workspaces of the job, keyed on their locks and the
      # toolchain. The key reads no tool, so the cache is restored before the recipe of the job installs Rust.
      - name: Cache the crates and the builds of Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            legacy/examples/cross-check-console/validators/rust/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-cross-check-console-${{ hashFiles('rust-toolchain.toml', 'legacy/examples/cross-check-console/validators/rust/Cargo.lock') }}
      - name: Install, then run the checks and write their report
