  form-comparison:
    name: Form comparison runner regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
      # The machine setup of the job, which no recipe makes (C19.20): the sandbox helper of Chrome.
      - uses: ./.github/actions/runner-setup
        with:
          browsers: chrome --chrome-sandbox
      - name: Install, then run the checks and write their report
        run: make ci-form-comparison
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-form-comparison
          path: var/report/ci-targets
          if-no-files-found: error
  form-comparison-pipeline:
    name: Record stores and the canonical flow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: phpize, php-config
      # actions/cache v6.1.0: the crates of Cargo and the builds of the workspaces of the job, keyed on their locks and the
      # toolchain. The key reads no tool, so the cache is restored before the recipe of the job installs Rust.
      - name: Cache the crates and the builds of Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            examples/form-comparison/servers/rust/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-form-comparison-pipeline-${{ hashFiles('rust-toolchain.toml', 'examples/form-comparison/servers/rust/Cargo.lock') }}
      # The machine setup of the job, which no recipe makes (C19.20): the sandbox helper of Chrome and nginx.
      - uses: ./.github/actions/runner-setup
        with:
          browsers: chrome --chrome-sandbox
          nginx: 'true'
      - name: Install, then run the checks and write their report
        run: make ci-form-comparison-pipeline
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-form-comparison-pipeline
          path: var/report/ci-targets
          if-no-files-found: error
  # The browser checks of each form server in a job of its own, which has the runner to itself; each job starts a local
  # stack whose servers take ports of the system and keeps the report of its server.
  form-comparison-browser:
    name: Form comparison browser checks against a local stack (${{ matrix.server }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        server: [php, php-ext, go, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: phpize, php-config
      # actions/cache v6.1.0: the crates of Cargo and the builds of the workspaces of the job, keyed on their locks and the
      # toolchain. The key reads no tool, so the cache is restored before the recipe of the job installs Rust.
      - name: Cache the crates and the builds of Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            examples/form-comparison/servers/rust/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-form-comparison-browser-${{ hashFiles('rust-toolchain.toml', 'examples/form-comparison/servers/rust/Cargo.lock') }}
      # The machine setup of the job, which no recipe makes (C19.20): the sandbox helper of Chrome and nginx.
      - uses: ./.github/actions/runner-setup
        with:
          browsers: chrome --chrome-sandbox
          nginx: 'true'
      - name: Install, then run the checks and write their report
        run: make ci-form-comparison-browser FORM_SERVERS=${{ matrix.server }}
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-form-comparison-browser-${{ matrix.server }}
          path: var/report/ci-targets
          if-no-files-found: error
      - name: Upload the browser report of the server
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: form-comparison-browser-${{ matrix.server }}
          path: var/form-comparison/browser
          if-no-files-found: error
  # Every other check of the form comparison once, against a local stack of its own at the same address: the PHP modes,
  # generation, persistence, the canonical flow, the browser summary of the four reports of form-comparison-browser,
  # typing and the evidence of all reports.
  form-comparison-checks:
    name: Form comparison checks against a local stack
    needs: form-comparison-browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: phpize, php-config
      # actions/cache v6.1.0: the crates of Cargo and the builds of the workspaces of the job, keyed on their locks and the
      # toolchain. The key reads no tool, so the cache is restored before the recipe of the job installs Rust.
      - name: Cache the crates and the builds of Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            examples/form-comparison/servers/rust/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-form-comparison-checks-${{ hashFiles('rust-toolchain.toml', 'examples/form-comparison/servers/rust/Cargo.lock') }}
      - name: Download the browser reports of the four servers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: form-comparison-browser-*
          path: var/form-comparison/browser
          merge-multiple: true
      # The machine setup of the job, which no recipe makes (C19.20): the sandbox helper of Chrome and nginx.
      - uses: ./.github/actions/runner-setup
        with:
          browsers: chrome --chrome-sandbox
          nginx: 'true'
      - name: Install, then run the checks and write their report
        run: make ci-form-comparison-checks
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-form-comparison-checks
          path: var/report/ci-targets
          if-no-files-found: error
