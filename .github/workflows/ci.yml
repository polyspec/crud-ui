      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      # actions/cache v6.1.0: the crates of Cargo and the builds of the workspace, keyed on their lock and the toolchain.
      - name: Cache the crates and the builds of Cargo
