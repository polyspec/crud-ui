        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      # actions/cache v6.1.0: the crates of Cargo and the builds of the workspaces of the job, keyed on their locks and the
      # toolchain. The key reads no tool, so the cache is restored before the recipe of the job installs Rust.
      - name: Cache the crates and the builds of Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-validator-rust-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Install, then run the checks and write their report
        run: make ci-validator-rust
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
