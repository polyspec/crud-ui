# The gate pipeline of crudui, from the pipeline that @polyspec/kit ships as an example. .github/workflows/ci.yml holds the
# triggers and the concurrency and calls it as a job (`uses: ./.github/workflows/ci-pipeline.yml`), so one push runs one
# workflow: the plan first, then shared and the runtime jobs in parallel, then required. The plan job writes the plan of
# config/ci.json into its outputs (make kit-ci-plan), and the matrix of the runtime jobs fans out from them. Each other job has
# one run step, make ci-<job>, whose recipe in the Makefile holds the content of the job, so a local run makes the same call
# (make ci-shared, make ci-runtime RUNTIME=php): it installs only the locked prerequisites of its group, declared in
# config/ci.json, and runs the gate of its group (make kit-gates-static, kit-gates-runtime-<runtime> of the Makefile) with the
# targets that config/ci.json declares for that group through make ci-targets, inside its context window.
name: ci-pipeline

on:
  workflow_call:

permissions:
  contents: read

# The toolchains of the checkout at their recorded versions (docs/operations/package-build.md): rustup installs nothing on the
# first cargo, and go never downloads the toolchain of a go.mod.
env:
  RUSTUP_AUTO_INSTALL: '0'
  GOTOOLCHAIN: local

jobs:
  # The plan job writes the plan of config/ci.json that the other jobs read.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      runtimes: ${{ steps.plan.outputs.runtimes }}
      has_runtimes: ${{ steps.plan.outputs.has_runtimes }}
      common_tools: ${{ steps.plan.outputs.common_tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The bootstrap of kit (K992): the Node.js of mise.toml, the locked kit package, the npm of var/tools and the packages.
      - uses: ./.github/actions/kit-bootstrap
      - id: plan
        run: make kit-ci-plan

  shared:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The bootstrap of kit (K992): the Node.js of mise.toml, the locked kit package, the npm of var/tools and the packages.
      - uses: ./.github/actions/kit-bootstrap
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: ${{ contains(needs.plan.outputs.common_tools, 'php') }}
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - name: shared gates
        run: make ci-shared
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kit-report-shared
          path: var/report/ci-targets/
          if-no-files-found: ignore

  runtime:
    needs: plan
    if: ${{ needs.plan.outputs.has_runtimes == 'true' }}
    strategy:
      fail-fast: false
      # The runtimes of crudui; the plan of config/ci.json adds the tools and targets of each.
      matrix:
        runtime: [go, php, php-ext, python, rust, ts]
        include: ${{ fromJSON(needs.plan.outputs.runtimes) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: ${{ matrix.runtime == 'php' || matrix.runtime == 'php-ext' }}
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      # The bootstrap of kit (K992): the Node.js of mise.toml, the locked kit package, the npm of var/tools and the packages.
      - uses: ./.github/actions/kit-bootstrap
      - name: runtime gate
        run: make ci-runtime RUNTIME=${{ matrix.runtime }}
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kit-report-runtime-${{ matrix.runtime }}
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The closing common part: it fails when a job that the plan selected does not succeed. The plan selects plan and shared,
  # and runtime when the repository has one; a job that the plan did not select is skipped, which make ci-passed without
  # FAIL_SKIPPED does not count as a failure, and a selected runtime job is skipped only when plan failed.
  required:
    if: ${{ always() }}
    needs: [plan, shared, runtime]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The bootstrap of kit (K992), whose utility ci-passed the target runs.
      - uses: ./.github/actions/kit-bootstrap
      - name: require every job that the plan selected
        run: make ci-passed RESULTS='${{ toJSON(needs) }}'
