# The documentation web of main on GitHub Pages (docs/operations/repository.md). It builds the documentation web of each
# commit that main receives and deploys it; the environment github-pages deploys only from main.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push to main waits for the running deployment instead of stopping it.
concurrency:
  group: github-pages
  cancel-in-progress: false

# The toolchains of the checkout at their recorded versions (docs/operations/package-build.md): rustup installs nothing on the
# first cargo, and go never downloads the toolchain of a go.mod.
env:
  RUSTUP_AUTO_INSTALL: '0'
  GOTOOLCHAIN: local

jobs:
  docs-web:
    name: documentation web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
      # actions/cache v6.1.0: the crates of Cargo and the builds of the workspaces of the job, keyed on their locks and the
      # toolchain. The key reads no tool, so the cache is restored before the recipe of the job installs Rust.
      - name: Cache the crates and the builds of Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-docs-web-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Install, then run the checks and write their report
        run: make ci-docs-web
      - name: Upload the report of the build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-docs-web
          path: var/report/ci-targets
          if-no-files-found: error
      - name: Upload documentation web
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/.web/dist

  deploy:
    name: Deploy documentation to GitHub Pages
    needs: docs-web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation web
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
