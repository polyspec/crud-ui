# The assets of each platform of the binding packages of crudui (binding GN-19a, GN-19i, C19.71): the job assets of release.yml
# calls it for the tree of the tag that it releases, with release true, which runs the release check of binding on the contract
# of each component before a job builds (make release-binding-check-<component>, binding GN-19g). Every recipe that builds an
# asset is in packages/<component>/release.mk, which binding release-recipes writes and Git ignores, so the recipe of each job
# first runs make release-recipes.
#
# The job platform runs on the runner of its platform, ubuntu-26.04, ubuntu-26.04-arm or macos-15, because no tool of the
# release compiles for another platform; it builds the Go static library (with the musl library of its arch on Linux), the
# abi3 wheel and the npm platform package of each component once. The job php builds the PHP extension of each component for
# one PHP minor of phpExtension.minors of config/toolchain.json per platform and minor (tests/build/ci-local.test.mts keeps
# the matrix equal to that list); the job npm builds the npm package of each component with the wasm-bindgen of mise.toml.
# Each uploads var/release/assets as an artifact, which the job publish of release.yml downloads. Each job has one run step,
# make ci-assets-<job> with make variables as its only arguments, RELEASE passing the input release (C19.20); its recipe in
# the Makefile installs Rust, the crates and Go first, and then runs the check and every build through ci-targets, each to its
# end, so one run names every asset that does not build.
name: assets

on:
  workflow_call:
    inputs:
      ref:
        description: The tag whose tree the jobs build; empty builds the commit of the calling run
        required: false
        type: string
        default: ''
      release:
        description: Whether each job runs the release check of binding before it builds
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# The toolchains of the checkout at their recorded versions (docs/operations/package-build.md): rustup installs nothing on the
# first cargo, and go never downloads the toolchain of a go.mod.
env:
  RUSTUP_AUTO_INSTALL: '0'
  GOTOOLCHAIN: local

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      # actions/checkout v7.0.1: the commit alone, whose time release-wheel reads to date the files of the wheel.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-assets-platform RELEASE=${{ inputs.release }}
      # actions/upload-artifact v7.0.1.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: assets-${{ matrix.platform }}
          path: var/release/assets/
          if-no-files-found: error

  php:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
            php: '8.4'
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
            php: '8.5'
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
            php: '8.4'
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
            php: '8.5'
          - platform: darwin-arm64
            runner: macos-15
            php: '8.4'
          - platform: darwin-arm64
            runner: macos-15
            php: '8.5'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # shivammathur/setup-php 2.40.0: the PHP of the minor of this entry and its php-config, which the build of ext-php-rs reads.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '${{ matrix.php }}'
          tools: none
          coverage: none
      - uses: ./.github/actions/kit-bootstrap
      # KyleMayes/install-llvm-action v2.0.9: the LLVM of config/toolchain.json (llvm.version), whose libclang and clang the
      # bindgen of ext-php-rs reads (binding GN-19i). The ubuntu-26.04 images hold it at /usr/lib/llvm-<major>; the macos-15
      # image does not, so the step installs it there and sets LLVM_PATH, which make ci-assets-php passes as LLVM_ROOT.
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        if: runner.os == 'macOS'
        with:
          version: '21.1.8'
          directory: ${{ runner.temp }}/llvm
      - run: make ci-assets-php PHP_MINOR=${{ matrix.php }} RELEASE=${{ inputs.release }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: assets-php-${{ matrix.platform }}-${{ matrix.php }}
          path: var/release/assets/
          if-no-files-found: error

  npm:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-assets-npm RELEASE=${{ inputs.release }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: assets-npm
          path: var/release/assets/
          if-no-files-found: error
