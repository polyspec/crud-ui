# The release workflow of crudui, from the release workflow that @polyspec/kit ships as an example.
#
# The workflow starts by itself when a push run of the CI workflow ci succeeds on main (K987): it checks out the head_sha of that
# run, and release-tag with AUTO releases it only when it is the version commit of the top ## X.Y.Z of its change log, which is
# the tip of its push; a commit whose top version is tagged elsewhere ends green with nothing to release, and a top version that
# no run released fails and names its version commit. A concurrency group of the job runs one release of the repository at a time.
# A dispatch of the workflow with the id of a successful CI run releases the commit of that run (K911): it tags the commit with
# the version of the newest section ## X.Y.Z of its change log (K924) and creates the GitHub Release of the tag as a draft with
# its archives, and makes it public. The run is the evidence; the release runs no test again. Each job runs one recipe of the
# Makefile (C19.20), make ci-release-tag and make ci-release-publish, whose lines run these targets in order and stop at the
# first failure:
#   bootstrap package installs the locked kit with the npm that devEngines.packageManager names, without scripts
#   install-tools TOOLS=npm installs the mise, the node and the npm of mise.toml with the bootstrap of @polyspec/kit
#   install-packages installs package-lock.json with that npm, @polyspec/kit included, whose utilities the targets below run
#   release-tag      with the kit of main: requires a completed successful push or dispatch run RUN of ci.yml on main whose
#                    commit is on origin/main, reads X.Y.Z from the change log of that commit, creates and pushes the annotated
#                    tag vX.Y.Z and the tag of every Go module at that commit, or passes for a tag there already (K269), and
#                    appends TAG and VERSION to GITHUB_ENV; a tag pushed with the token of the run starts no run
#   release-tag-output gives TAG and VERSION to the job publish, which checks out the tag and bootstraps the tagged commit again
#   release-zip      fails unless zip, which Composer needs for the release archives, is on PATH
#   release-prepare  the preparation of the release (none)
#   release-tools    installs the tools that config/release.json needs for the packages of this repository
#   release-assets  builds the archive of every package, the zips of the PHP extensions of packages/validator/php-ext and
#                    packages/generator/php-ext, and packages.json, the Composer repository from which PIE installs them,
#                    into var/release/assets, and the recipe merges the assets of the job assets into it
#   release-recipes  writes packages/<component>/release.mk, the release recipes of the bindings (binding GN-19h), after the
#                    install of Rust, the crates and Go
#   release-go-module-<component> carries the Go module of each component with the static libraries of the platforms
#                    (binding GN-19f) and pushes its tag, with the identity of the actor of the run
#   release-publish creates the GitHub Release of the tag as a draft, with its notes and those files
#   release-platform-assets-<component> uploads the assets of each platform to the draft under their labels (binding GN-19g)
#   release-undraft makes the release public
# The job assets calls assets.yml with the tag (binding GN-19i, C19.71): it builds the assets of each platform on the runner of
# that platform, after the release check of binding (make release-binding-check-<component>), which fails while a dependency
# line of polyspec-binding-core names a branch or a commit (binding CK-70). The job publish downloads those assets into
# var/release/platform-assets before its run step. The packages of the release are the binding packages of the components; the
# legacy crudui-* packages are no package of config/release.json, so the release publishes none of them.
# The recipe of publish runs with var/tools/bin first on PATH. A failed target leaves the release a draft and fails the run.
# GH_TOKEN, the token of the run, is the one variable that a run step sets.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: The id of the successful CI run of main whose commit is released
        required: true
        type: string

permissions:
  contents: write
  actions: read

# The toolchains of the checkout at their recorded versions (docs/operations/package-build.md): rustup installs nothing on the
# first cargo, and go never downloads the toolchain of a go.mod.
env:
  RUSTUP_AUTO_INSTALL: '0'
  GOTOOLCHAIN: local

jobs:
  tag:
    # A workflow_run starts the release for a successful push or dispatch run of CI alone (K987). The concurrency group is the job's,
    # so a run whose job is skipped never replaces the pending release of a version commit.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      # actions/checkout v7.0.1: with the whole history and every branch, so origin/main is there for the ancestry check; a
      # workflow_run checks out the head_sha of its CI run, never a later main (K987), and a dispatch checks out main, whose kit
      # runs release-tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      # The bootstrap of kit (K992): the Node.js of mise.toml, the locked kit package, the npm of var/tools and the packages.
      - uses: ./.github/actions/kit-bootstrap
      - id: tag
        name: tag the commit of the CI run and give the tag to the job publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: make ci-release-tag RUN=${{ inputs.run }}

  assets:
    needs: tag
    if: ${{ needs.tag.outputs.tag != '' }}
    uses: ./.github/workflows/assets.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      release: true

  publish:
    needs: [tag, assets]
    if: ${{ needs.tag.outputs.tag != '' }}
    concurrency:
      group: release-${{ github.repository }}-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      # The release builds the tagged commit with its own kit and packages.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}
      # shivammathur/setup-php 2.40.0: the PHP of .php-version for the Composer packages and the extension of the release. A
      # repository that needs PHP (a Composer package of config/release.json, or php of config/toolchain.json) declares
      # .php-version; a repository without PHP has none and sets up no PHP. The release runs no check of its own: release-tag
      # refuses a commit whose CI run did not pass (K755).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: ${{ hashFiles('.php-version') != '' }}
        with:
          php-version-file: .php-version
          tools: none
          # The proof runs with no debugger or coverage driver, as the checks do.
          coverage: none
      # actions/download-artifact v8.0.1: the assets of each platform that the job assets built, merged into
      # var/release/platform-assets, which make ci-release-publish merges into var/release/assets after release-assets.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: var/release/platform-assets
          merge-multiple: true
      # The bootstrap of kit for the tagged commit, with its own kit and packages (K992).
      - uses: ./.github/actions/kit-bootstrap
      - name: release the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: make ci-release-publish
