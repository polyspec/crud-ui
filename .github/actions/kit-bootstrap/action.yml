# The bootstrap of every CI job of crudui, from the bootstrap action that @polyspec/kit ships as an example: ci-pipeline.yml,
# ci.yml, pages.yml and release.yml run it after their checkout with `uses: ./.github/actions/kit-bootstrap`. The runtime
# and release jobs set PHP up before it; the shared job of ci-pipeline sets it up after.
name: kit bootstrap
description: Sets up the Node.js of mise.toml, installs the locked kit package, then the npm of var/tools and the packages of package-lock.json.
runs:
  using: composite
  steps:
    # actions/setup-node v7.1.0: the Node.js of mise.toml starts the bootstrap, which installs that release into var/tools with
    # mise (K171); the tools of @polyspec/kit then run the node of var/tools. The pinned npm of var/tools installs the packages,
    # so the cache of setup-node is off.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: mise.toml
        package-manager-cache: false
    # The locked kit package, whose bootstrap make install-tools TOOLS=npm runs. npm 11 of the runner refuses to run in a folder
    # whose devEngines names npm 12.2.0 (EBADDEVENGINES), so the npm of devEngines runs outside the checkout with --prefix; it
    # reads the .npmrc of the checkout, whose allow-remote=root admits the release URLs of package.json.
    - name: bootstrap the installed kit package
      shell: bash
      run: |
        root="$PWD"
        version="$(node -p 'require("./package.json").devEngines.packageManager.version')"
        (cd "${RUNNER_TEMP:?RUNNER_TEMP is not set}" && npm_config_cache="$root/var/bootstrap/npm-cache" npm exec --yes --package="npm@$version" -- npm --prefix "$root" ci --ignore-scripts)
    # The bootstrap order of a repository (K71-2): the mise, node and npm of mise.toml first, then the packages of
    # package-lock.json with it.
    - name: install npm
      shell: bash
      run: make install-tools TOOLS=npm
    - name: install packages
      shell: bash
      run: make install-packages
