[package]
name = "polyspec-crudui-validator"
version = "0.0.20"
edition = "2021"
rust-version = "1.99.0"
license = "MIT"

[lib]
name = "polyspec_crudui_validator"
path = "src/lib.rs"

[dependencies]
# The kind interface that the generated bindings read from the core errors (bindgen design E-1, I-2 (3)). The git
# source is the bindgen repository; Cargo.lock pins its commit, the same source as the generated binding crates.
polyspec-bindgen-core = { git = "https://github.com/polyspec/bindgen.git", branch = "v1/rust-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
libtest-mimic = "0.8"

[[test]]
name = "validate_conformance"
harness = false

[[test]]
name = "expr_conformance"
harness = false

[[test]]
name = "text_validity_conformance"
harness = false

[[test]]
name = "list_validity_conformance"
harness = false

[[test]]
name = "detail_validity_conformance"
harness = false

[[test]]
name = "spec_validity_conformance"
harness = false

[[test]]
name = "compose_conformance"
harness = false

[lints]
workspace = true

[workspace]

# make lint-rust runs cargo clippy, which fails on a warning and on the lints that hide an error (P8).
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_methods = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
