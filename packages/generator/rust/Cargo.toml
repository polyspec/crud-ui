[package]
name = "polyspec-crud-ui-generator"
version = "0.0.20"
edition = "2021"
rust-version = "1.99.0"
license = "MIT"
# The package holds the interface contract of the bindings beside the source, so that a repository that depends on
# this crate reads the contract from the package that Cargo resolved (binding design I-1, T-3).
include = ["/src/**/*.rs", "/interface.json", "/README.md"]
description = "CRUDUI form compilation, data binding and HTML rendering"

[features]
# Compiles the fault injection points of the core (binding G-5, GN-5), such as the random source of CURT-095, for the
# tests only: a point is live only in a crate whose own feature fault-test is on; no release build has it.
fault-test = ["polyspec-binding-core/fault-test"]

[dependencies]
# The kind interface that the generated bindings read from the core errors (binding design E-1, I-2 (3)). The git
# source is the binding repository; Cargo.lock pins its commit, the same source as the generated binding crates.
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", tag = "v0.0.2" }
# The owner of the value type json_value of the interface contract (F-1 (a), C-10): Cargo resolves the package whose
# interface.json the contract check reads (binding design I-1, T-3). The JSON reading and writing of the crate move to it
# in the C-1 change of C-10.
polyspec-json = { git = "https://github.com/polyspec/json.git", branch = "v1/rust-core" }
polyspec-crud-ui-validator = { path = "../../validator/rust", version = "0.0.20" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
getrandom = "0.4"
chrono = "0.4"
regex = "1"
ryu-js = "1"
num-bigint = "0.5"
num-traits = "0.2"

[dev-dependencies]
libtest-mimic = "0.8"
# The tests of the crate arm its fault injection points without flags (binding CK-65, GN-5).
polyspec-crud-ui-generator = { path = ".", features = ["fault-test"] }

[[test]]
name = "history_functions"
harness = false

[[test]]
name = "input_text"
harness = false

[[test]]
name = "template_shape"
harness = false

[[test]]
name = "form_state"
harness = false

[[test]]
name = "form_render"
harness = false

[[test]]
name = "buttons"
harness = false

[[test]]
name = "form_outline"
harness = false

[[test]]
name = "form_complete"
harness = false

[[test]]
name = "list_render"
harness = false

[[test]]
name = "detail_render"
harness = false

[[test]]
name = "validity_render"
harness = false

[[test]]
name = "contract_cases"
harness = false

[lints]
workspace = true
