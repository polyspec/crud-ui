[package]
name = "polyspec-crudui-generator"
version = "0.0.20"
edition = "2021"
rust-version = "1.99.0"
license = "MIT"
# The package holds the interface contract of the bindings beside the source, so that a repository that depends on
# this crate reads the contract from the package that Cargo resolved (bindgen design I-1, T-3).
include = ["/src/**/*.rs", "/interface.json", "/README.md"]
description = "CRUDUI form compilation, data binding and HTML rendering"

[dependencies]
# The kind interface that the generated bindings read from the core errors (bindgen design E-1, I-2 (3)). The git
# source is the bindgen repository; Cargo.lock pins its commit, the same source as the generated binding crates.
polyspec-bindgen-core = { git = "https://github.com/polyspec/bindgen.git", branch = "v1/rust-core" }
# The owner of the value type json_value of the interface contract (F-1 (a), C-10): Cargo resolves the package whose
# interface.json the contract check reads (bindgen design I-1, T-3). The JSON reading and writing of the crate move to it
# in the C-1 change of C-10.
polyspec-ordered-json = { git = "https://github.com/polyspec/ordered-json.git", branch = "v1/rust-core" }
polyspec-crudui-validator = { path = "../../validator/rust", version = "0.0.20" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
getrandom = "0.4"
chrono = "0.4"
regex = "1"
ryu-js = "1"
num-bigint = "0.5"
num-traits = "0.2"

[dev-dependencies]
libtest-mimic = "0.8"

[[test]]
name = "history_functions"
harness = false

[[test]]
name = "input_text"
harness = false

[[test]]
name = "template_shape"
harness = false

[[test]]
name = "form_state"
harness = false

[[test]]
name = "form_render"
harness = false

[[test]]
name = "buttons"
harness = false

[[test]]
name = "form_outline"
harness = false

[[test]]
name = "form_complete"
harness = false

[[test]]
name = "list_render"
harness = false

[[test]]
name = "detail_render"
harness = false

[[test]]
name = "validity_render"
harness = false

[lints]
workspace = true

[workspace]

# make lint-rust runs cargo clippy, which fails on a warning and on the lints that hide an error (P8).
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_methods = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
