[package]
name = "polyspec-crudui-bench"
version = "0.0.17"
edition = "2021"
rust-version = "1.99.0"

[[bin]]
name = "polyspec-crudui-bench"
path = "main.rs"

[dependencies]
polyspec-crudui-validator = { path = "../../../packages/validator/rust" }
serde_json = { version = "1", features = ["preserve_order"] }

# Always build the bench optimized — an unoptimized debug build would measure
# the wrong thing entirely. `cargo run --release` from the Makefile picks this
# up; this profile block just guarantees release codegen even if invoked plainly.
[profile.release]
opt-level = 3
# Keep release artifacts unstripped: the debuginfo strip runs the toolchain's rust-objcopy, whose
# macOS distribution may lack libLLVM.dylib.
strip = "none"

[lints]
workspace = true

[workspace]

# make lint-rust runs cargo clippy, which fails on a warning and on the lints that hide an error (P8).
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
