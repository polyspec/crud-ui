# The tools that mise installs into var/tools/mise: `make toolchain-lock` writes their digests into mise.lock and
# `make install-tools` installs them with `mise install --locked`. This checkout records each exact version; node is the
# Node.js of the checkout, which `make install-tools TOOLS=npm` installs first (kit K171).
[tools]
node = "26.12.0"
"npm:npm" = "12.2.0"
go = "1.27.3"
python = "3.14.8"
uv = "0.12.24"
ruff = "0.17.2"
"github:asamarts/alint" = "0.18.2"
golangci-lint = "2.14.0"
"go:golang.org/x/tools/cmd/deadcode" = "0.52.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"
"github:rustsec/rustsec" = { version = "0.22.2", version_prefix = "cargo-audit/v" }
"pypi:vulture" = "2.16"
# The wasm-bindgen CLI writes the glue of the WASM binding crates packages/<component>/ts/wasm and must be the release of
# their wasm-bindgen crate (binding GN-18); mise.lock pins the digest of its release asset.
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"
"http:composer" = { version = "2.10.3", url = "https://getcomposer.org/download/{{ version }}/composer.phar", checksum = "sha256:7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6", bin = "composer" }
# The PIE PHAR builds and installs the OrderedJSON extension from the Composer repository of the release (C17.84); its
# sha256 is that of the release asset pie.phar.
"http:pie" = { version = "1.4.10", url = "https://github.com/php/pie/releases/download/{{version}}/pie.phar", checksum = "sha256:b88792235c8e80be568436d4cb043b49fd1869c89b64e83d23e2882ae19d70a8", bin = "pie" }

# The settings of mise and uv of this checkout: mise installs and runs only what mise.lock pins and installs nothing on its own,
# and uv downloads no Python, takes the Python of PATH, where the shims of mise come first, reads no uv.toml of the home and
# keeps its cache under var/tools.
[settings]
locked = true
auto_install = false

[env]
UV_PYTHON_DOWNLOADS = "never"
UV_PYTHON_PREFERENCE = "only-system"
UV_NO_CONFIG = "1"
UV_CACHE_DIR = "{{config_root}}/var/tools/mise/cache/uv"
