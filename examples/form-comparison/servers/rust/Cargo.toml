[package]
name = "polyspec-crudui-form-comparison"
version = "0.0.20"
edition = "2021"
rust-version = "1.99.0"
publish = false

[dependencies]
polyspec-crud-ui-generator = { path = "../../../../packages/generator/rust" }
polyspec-crud-ui-validator = { path = "../../../../packages/validator/rust" }
ordered-json = { package = "polyspec-ordered-json", git = "https://github.com/polyspec/ordered-json", tag = "v0.0.25", version = "0.0.25" }
serde_json = { version = "1", features = ["preserve_order"] }
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
form_urlencoded = "1.2"
tempfile = "3"
ryu-js = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[workspace]

# make lint-rust runs cargo clippy, which fails on a warning and on the lints that hide an error (P8).
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
